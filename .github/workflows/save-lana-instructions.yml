name: Save LANa Instructions

# LANa calls this via GitHub API to queue instructions for the next scheduled post.
# Trigger: POST /repos/{owner}/{repo}/actions/workflows/save-lana-instructions.yml/dispatches
# with inputs below. The queued data is written to scripts/lana-memory.json and committed.
# generate-post.mjs reads this file first on the next scheduled run.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Blog topic / title idea'
        required: false
        type: string
      keyword:
        description: 'Primary SEO keyword'
        required: false
        type: string
      category:
        description: 'Category (AI Automation, Digital Marketing, Virtual Assistant, Lead Generation…)'
        required: false
        type: string
      pain_point:
        description: 'Reader pain point to address'
        required: false
        type: string
      angle:
        description: 'Angle or story direction (e.g. problem-solution, case study, how-to)'
        required: false
        type: string
      tone_notes:
        description: 'Tone notes (e.g. grounded, sharp, practical, pain relief)'
        required: false
        type: string
      source_notes:
        description: 'Source notes, creator update, or story direction to respond to without copying'
        required: false
        type: string
      source_url:
        description: 'Optional source URL for context'
        required: false
        type: string
      fiker_take:
        description: 'Fiker/LuliDigital point of view to add'
        required: false
        type: string
      cta_text:
        description: 'End-of-article CTA text'
        required: false
        type: string
      cta_link:
        description: 'Internal link for the CTA (/ai, /marketing, /virtual-assistant, /landing-pages)'
        required: false
        type: string
      draft:
        description: 'Generate as draft instead of publishing immediately'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  save-instructions:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LANA_TOPIC: ${{ github.event.inputs.topic }}
      LANA_KEYWORD: ${{ github.event.inputs.keyword }}
      LANA_CATEGORY: ${{ github.event.inputs.category }}
      LANA_PAIN_POINT: ${{ github.event.inputs.pain_point }}
      LANA_ANGLE: ${{ github.event.inputs.angle }}
      LANA_TONE_NOTES: ${{ github.event.inputs.tone_notes }}
      LANA_SOURCE_NOTES: ${{ github.event.inputs.source_notes }}
      LANA_SOURCE_URL: ${{ github.event.inputs.source_url }}
      LANA_FIKER_TAKE: ${{ github.event.inputs.fiker_take }}
      LANA_CTA_TEXT: ${{ github.event.inputs.cta_text }}
      LANA_CTA_LINK: ${{ github.event.inputs.cta_link }}
      LANA_DRAFT: ${{ github.event.inputs.draft }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Write instructions to memory file
        run: |
          import { readFileSync, writeFileSync, existsSync } from "fs";
          const path = "scripts/lana-memory.json";
          const existing = existsSync(path) ? JSON.parse(readFileSync(path, "utf8")) : { pending_post: null, pending_drafts: [] };
          const input = (name) => (process.env[name] || "").trim();
          const pending = {
            topic:      input("LANA_TOPIC") || null,
            keyword:    input("LANA_KEYWORD") || null,
            category:   input("LANA_CATEGORY") || null,
            pain_point: input("LANA_PAIN_POINT") || null,
            angle:      input("LANA_ANGLE") || null,
            tone_notes: input("LANA_TONE_NOTES") || null,
            source_notes: input("LANA_SOURCE_NOTES") || null,
            source_url: input("LANA_SOURCE_URL") || null,
            fiker_take: input("LANA_FIKER_TAKE") || null,
            cta_text:   input("LANA_CTA_TEXT") || null,
            cta_link:   input("LANA_CTA_LINK") || null,
            draft:      input("LANA_DRAFT") !== "false",
            queued_at:  new Date().toISOString(),
          };
          Object.keys(pending).forEach(k => { if (pending[k] === null || pending[k] === "") delete pending[k]; });
          writeFileSync(path, JSON.stringify({ ...existing, pending_post: pending }, null, 2));
          console.log("Saved:", JSON.stringify(pending, null, 2));
        shell: node {0}

      - name: Commit and push memory file
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add scripts/lana-memory.json
          git diff --staged --quiet && echo "Nothing changed" && exit 0
          git commit -m "lana: queue next post instructions"
          git push

      - name: Confirm via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOPIC="$LANA_TOPIC"
          ANGLE="$LANA_ANGLE"
          SOURCE="$LANA_SOURCE_NOTES"
          DRAFT="$LANA_DRAFT"
          if [ -z "$TOPIC" ]; then TOPIC="(SEO auto-select)"; fi
          if [ "$DRAFT" = "false" ]; then STATUS="and publish immediately"; else STATUS="as a draft for your approval"; fi
          TEXT=$(printf "Got it. Queued for the next scheduled post.\n\nTopic: %s\nAngle: %s\nSource notes: %s\nWill generate: %s\n\nI'll run this on the next scheduled post (Mon, Wed, or Fri at 08:17 UTC / 10:17 South Africa). You can override it anytime by sending new instructions." "$TOPIC" "${ANGLE:-not specified}" "${SOURCE:-not specified}" "$STATUS")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
