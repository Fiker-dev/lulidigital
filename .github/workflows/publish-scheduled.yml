name: Publish Scheduled Posts

# Runs every morning. Any draft whose scheduledFor date has arrived is flipped
# live, deployed (via the commit), and submitted to Google for indexing — so
# scheduled posts go live AND get crawled on their planned day.

on:
  schedule:
    # Daily at 06:07 UTC (off :00 to avoid dropped runs), before Auto Blog Post.
    - cron: '7 6 * * *'
  workflow_dispatch:

concurrency:
  group: lulidigital-content-writes
  cancel-in-progress: false

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enforce the Mon/Wed/Fri publishing rhythm
        run: |
          # Blog posts go out on Monday, Wednesday and Friday only. The cron
          # runs daily so a post is never left waiting after its date, but
          # publishing itself is gated here — otherwise a post dated Tue/Thu
          # (or a manual dispatch on the wrong day) breaks the rhythm.
          DOW=$(date -u +%u)   # 1=Mon … 7=Sun
          case "$DOW" in
            1|3|5) echo "Publishing day ($(date -u +%A)) — continuing." ;;
            *)
              echo "$(date -u +%A) is not a publishing day (Mon/Wed/Fri only). Skipping."
              echo "SKIP" > /tmp/skip_publish.txt
              ;;
          esac

      - name: Publish any due scheduled posts
        run: node scripts/publish-scheduled.mjs

      - name: Commit and push
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "false" > /tmp/scheduled_changed.txt
            echo "Nothing due today."
            exit 0
          fi
          COUNT=$(node -e "console.log((JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8'))).length)")
          git commit -m "Publish ${COUNT} scheduled blog post(s)"
          git push
          echo "true" > /tmp/scheduled_changed.txt

      - name: Verify each post is actually LIVE before claiming it
        if: ${{ always() }}
        run: |
          # The git commit succeeding does NOT mean the page exists — Vercel
          # still has to build. On 2026-08-21 a post was announced as live
          # while the URL 404'd for 40 minutes. Poll before saying anything.
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Nothing published; skipping verification."
            exit 0
          fi
          ALL_LIVE=true
          : > /tmp/live-status.txt
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            CODE=000
            # up to ~4 min, Vercel builds this site in well under a minute
            for i in $(seq 1 24); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
              [ "$CODE" = "200" ] && break
              sleep 10
            done
            if [ "$CODE" = "200" ]; then
              echo "LIVE $url" >> /tmp/live-status.txt
            else
              echo "DEAD($CODE) $url" >> /tmp/live-status.txt
              ALL_LIVE=false
            fi
          done
          echo "$ALL_LIVE" > /tmp/all_live.txt
          cat /tmp/live-status.txt
          if [ "$ALL_LIVE" != "true" ]; then
            echo "::error::One or more published posts are not reachable — the deploy likely failed."
            exit 1
          fi

      - name: Request indexing for each published post
        if: ${{ always() }}
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: |
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "No newly published posts; skipping indexing."
            exit 0
          fi
          # Never ask Google to index a URL that isn't resolving.
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Posts are not live yet — skipping indexing so we don't submit 404s."
            exit 0
          fi
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            node scripts/request-indexing.mjs "$url" || true
          done

      - name: Send the LinkedIn company announcement for each new post
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Fiker wants the company announcement in hand the moment a blog is
          # live, not hours later when the Social Team routine next runs.
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then exit 0; fi
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Post isn't live; not sending an announcement for it."
            exit 0
          fi
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            SLUG=$(basename "$url")
            OUT=$(node scripts/send-announcement-telegram.mjs --for "$SLUG" 2>&1 || true)
            echo "$OUT"
            # The caption is written by the Social Team routine (an LLM job) —
            # if it hasn't run yet there is no pack, so say so rather than
            # leaving her wondering where the announcement is.
            if echo "$OUT" | grep -q "Nothing due to deliver"; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=📝 LinkedIn company announcement for '${SLUG}' isn't written yet — the Social Team routine writes it on its next run (Mon/Wed/Fri ~10:17 UTC) and it'll be sent here automatically." > /dev/null
            fi
          done

      - name: Telegram notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then exit 0; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          ALL_LIVE=$(cat /tmp/all_live.txt 2>/dev/null || echo false)
          if [ "$ALL_LIVE" = "true" ]; then
            MSG=$(node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8'));console.log('✅ Blog live + submitted to Google:\n\n'+p.map(x=>x.title+'\n'+x.url).join('\n\n')+'\n\n📍 Google Business Profile — paste as a new post, button Learn more → the link above:\n———\n'+p.map(x=>'New from LuliDigital: '+x.title+'.').join('\n')+'\n———')")
          else
            # Never claim live when it isn't — that is what sent a dead link on 2026-08-21.
            MSG=$(node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8'));console.log('⚠️ Blog published in git but NOT reachable yet — the Vercel deploy has probably failed. NOT submitted to Google.\n\n'+p.map(x=>x.title+'\n'+x.url).join('\n\n')+'\n\nCheck: vercel ls (an UNKNOWN status with no build duration means it never built).')")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
