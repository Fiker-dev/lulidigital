name: Publish Scheduled Posts

# Runs every morning. Any draft whose scheduledFor date has arrived is flipped
# live, deployed (via the commit), and submitted to Google for indexing — so
# scheduled posts go live AND get crawled on their planned day.

on:
  schedule:
    # GitHub's scheduled runs are best-effort: observed 06:07 UTC firing at
    # 11:49, 12:37, 17:34 and 18:34 on consecutive days, and sometimes skipped
    # entirely. Every "the blog didn't go out" so far traces to this, not to the
    # content pipeline. So: run EARLY, and run again later as a catch-up.
    #
    # 04:23 UTC — early enough that even a 4-hour slip still lands in Fiker's
    # morning (SAST is UTC+2).
    # Measured 2026-10-02 over ten consecutive runs: this 04:23 slot actually
    # fires 10:02-10:59, and the 13:41 one 17:55-20:13. A steady ~6h slip. So
    # add two slots just after midnight UTC — the same slip puts them in Fiker's
    # early morning instead of her lunchtime. Whichever fires first publishes;
    # the rest find nothing to do, because the job only touches drafts that are
    # due and still draft:true.
    - cron: '17 0 * * *'
    - cron: '29 2 * * *'
    - cron: '23 4 * * *'
    # 13:41 UTC — catch-up. The job is idempotent (it only publishes posts whose
    # scheduledFor is due and still draft), so a second run costs nothing when
    # the first one worked, and rescues the day when it didn't.
    - cron: '41 13 * * *'
  workflow_dispatch:

concurrency:
  group: lulidigital-content-writes
  cancel-in-progress: false

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enforce the Mon/Wed/Fri publishing rhythm
        run: |
          # Blog posts go out on Monday, Wednesday and Friday only. The cron
          # runs daily so a post is never left waiting after its date, but
          # publishing itself is gated here — otherwise a post dated Tue/Thu
          # (or a manual dispatch on the wrong day) breaks the rhythm.
          DOW=$(date -u +%u)   # 1=Mon … 7=Sun
          case "$DOW" in
            1|3|5) echo "Publishing day ($(date -u +%A)) — continuing." ;;
            *)
              echo "$(date -u +%A) is not a publishing day (Mon/Wed/Fri only). Skipping."
              echo "SKIP" > /tmp/skip_publish.txt
              ;;
          esac

      - name: Publish any due scheduled posts
        run: node scripts/publish-scheduled.mjs

      - name: Commit and push
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "false" > /tmp/scheduled_changed.txt
            echo "Nothing due today."
            exit 0
          fi
          COUNT=$(node -e "console.log((JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8'))).length)")
          git commit -m "Publish ${COUNT} scheduled blog post(s)"
          git push
          echo "true" > /tmp/scheduled_changed.txt

      - name: Verify each post is actually LIVE before claiming it
        if: ${{ always() }}
        run: |
          # The git commit succeeding does NOT mean the page exists — Vercel
          # still has to build. On 2026-08-21 a post was announced as live
          # while the URL 404'd for 40 minutes. Poll before saying anything.
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Nothing published; skipping verification."
            exit 0
          fi
          ALL_LIVE=true
          : > /tmp/live-status.txt
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            CODE=000
            # up to ~4 min, Vercel builds this site in well under a minute
            for i in $(seq 1 24); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
              [ "$CODE" = "200" ] && break
              sleep 10
            done
            if [ "$CODE" = "200" ]; then
              echo "LIVE $url" >> /tmp/live-status.txt
            else
              echo "DEAD($CODE) $url" >> /tmp/live-status.txt
              ALL_LIVE=false
            fi
          done
          echo "$ALL_LIVE" > /tmp/all_live.txt
          cat /tmp/live-status.txt
          if [ "$ALL_LIVE" != "true" ]; then
            echo "::error::One or more published posts are not reachable — the deploy likely failed."
            exit 1
          fi

      - name: Request indexing for each published post
        if: ${{ always() }}
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: |
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "No newly published posts; skipping indexing."
            exit 0
          fi
          # Never ask Google to index a URL that isn't resolving.
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Posts are not live yet — skipping indexing so we don't submit 404s."
            exit 0
          fi
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            node scripts/request-indexing.mjs "$url" || true
          done

      # GBP was only wired into auto-blog (manual "publish now" only) and
      # publish-draft-blog — never into THIS workflow, which is the one every
      # scheduled and queued post actually goes through. So no normal post would
      # ever have reached the Business Profile, quota or not.
      - name: Post each new blog to Google Business Profile
        if: always()
        continue-on-error: true
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: |
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then exit 0; fi
          # Same rule as the announcement: never point a Business Profile post
          # at a page that isn't reachable yet.
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Post isn't live; not posting it to the Business Profile."
            exit 0
          fi
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            SLUG=$(basename "$url")
            TITLE=$(node -e "const r=require('fs').readFileSync('src/content/blog/'+process.argv[1]+'.md','utf8');console.log((r.match(/^title:\s*\"?([^\"\n]+)\"?/m)||[])[1]||'')" "$SLUG")
            DESC=$(node -e "const r=require('fs').readFileSync('src/content/blog/'+process.argv[1]+'.md','utf8');console.log((r.match(/^description:\s*\"?([^\"\n]+)\"?/m)||[])[1]||'')" "$SLUG")
            # Exits 0 with "Skipping" while the account/location IDs are still
            # missing (GBP quota pending), so this is quiet until it can work.
            node scripts/publish-google-business-post.mjs "$TITLE" "$DESC" "$SLUG" || true
          done

      - name: Send the LinkedIn company announcement for each new post
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Fiker wants the company announcement in hand the moment a blog is
          # live, not hours later when the Social Team routine next runs.
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then exit 0; fi
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Post isn't live; not sending an announcement for it."
            exit 0
          fi
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8')).forEach(p=>console.log(p.url))"); do
            SLUG=$(basename "$url")
            # Safety net: the pack is normally built at approval time by
            # schedule-draft.yml. Posts approved before that existed — and the
            # "publish now" path — can still arrive here without one, so build
            # it on the spot rather than sending an apology message.
            if [ ! -f "social/queue/${SLUG}/linkedin-company.md" ]; then
              echo "No announcement pack for ${SLUG}; building it now."
              node scripts/generate-blog-announcement.mjs --slug "$SLUG" || true
              if [ -f "social/queue/${SLUG}/linkedin-company.md" ]; then
                git add "social/queue/${SLUG}" || true
                git commit -m "Announcement pack for ${SLUG}" || true
                git push || true
              fi
            fi
            OUT=$(node scripts/send-announcement-telegram.mjs --for "$SLUG" 2>&1 || true)
            echo "$OUT"
            if echo "$OUT" | grep -q "Nothing due to deliver"; then
              node scripts/tg.mjs --text "📝 The LinkedIn company announcement for '${SLUG}' could not be built automatically. Ask Claude to run: node scripts/generate-blog-announcement.mjs --slug ${SLUG}"
            fi
          done

      # Both Vercel crons returned "CRON_SECRET is not configured" every day
      # and nobody noticed, because a cron that fails silently looks exactly
      # like a cron that had nothing to do. Check them where someone will see it.
      - name: Check the Vercel crons are actually configured
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          BROKEN=""
          for p in seo-agent weekly-seo; do
            CODE=$(curl -s -o /tmp/cron-body.txt -w "%{http_code}" "https://lulidigital.com/api/cron/$p")
            # 401 is correct and healthy: the route is up and rejecting unauthorised
            # callers. 500 means it cannot even read its own secret.
            if [ "$CODE" = "500" ]; then
              BROKEN="${BROKEN}\n  /api/cron/${p}: $(head -c 120 /tmp/cron-body.txt)"
            fi
            echo "/api/cron/$p -> $CODE"
          done
          # Warn at most once a week, on Monday's afternoon run. This check
          # fired on all four daily runs, so a known, already-reported problem
          # produced four identical messages a day — which is how you teach
          # someone to ignore their alerts. It stops by itself once fixed.
          if [ "$(date -u +%u)" != "1" ] || [ "${GITHUB_EVENT_SCHEDULE:-}" != "41 13 * * *" ]; then
            [ -n "$BROKEN" ] && echo "Vercel crons still misconfigured — not the weekly slot, staying quiet."
            BROKEN=""
          fi
          if [ -n "$BROKEN" ]; then
            MSG=$(printf "⚠️ Vercel cron jobs are misconfigured and have been failing silently:%b\n\nFix: add CRON_SECRET to the Vercel project env (any long random string). That revives the SEO agent, the weekly SEO run, and the on-time blog publish." "$BROKEN")
            node scripts/tg.mjs --text "$MSG" --no-verify || true
          fi

      - name: Telegram notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(cat /tmp/scheduled_changed.txt 2>/dev/null || echo false)" != "true" ]; then exit 0; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          ALL_LIVE=$(cat /tmp/all_live.txt 2>/dev/null || echo false)
          if [ "$ALL_LIVE" = "true" ]; then
            MSG=$(node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8'));console.log('✅ Blog live + submitted to Google:\n\n'+p.map(x=>x.title+'\n'+x.url).join('\n\n')+'\n\n📍 Google Business Profile — paste as a new post, button Learn more → the link above:\n———\n'+p.map(x=>'New from LuliDigital: '+x.title+'.').join('\n')+'\n———')")
          else
            # Never claim live when it isn't — that is what sent a dead link on 2026-08-21.
            MSG=$(node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/published-scheduled.json','utf8'));console.log('⚠️ Blog published in git but NOT reachable yet — the Vercel deploy has probably failed. NOT submitted to Google.\n\n'+p.map(x=>x.title+'\n'+x.url).join('\n\n')+'\n\nCheck: vercel ls (an UNKNOWN status with no build duration means it never built).')")
          fi
          node scripts/tg.mjs --text "${MSG}"
