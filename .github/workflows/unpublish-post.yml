name: Unpublish Blog Post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Blog post slug to unpublish'
        required: true
        type: string

concurrency:
  group: lulidigital-content-writes
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UNPUBLISH_SLUG: ${{ github.event.inputs.slug }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Unpublish post
        run: node scripts/unpublish-post.mjs "$UNPUBLISH_SLUG"

      - name: Commit and push
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Unpublish blog post ${UNPUBLISH_SLUG}"
          git push

      - name: Send Telegram confirmation
        run: |
          SLUG="$UNPUBLISH_SLUG"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=Taken down: ${SLUG}. It's hidden from the site. Let me know if you want a replacement."
