name: Unpublish Blog Post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Blog post slug to unpublish'
        required: true
        type: string

jobs:
  unpublish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpublish post
        run: node scripts/unpublish-post.mjs "${{ github.event.inputs.slug }}"

      - name: Commit and push
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Unpublish blog post ${{ github.event.inputs.slug }}"
          git push

      - name: Send Telegram confirmation
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=Taken down: ${SLUG}. It's hidden from the site. Let me know if you want a replacement."
