name: Auto Blog Post

on:
  # RESTORED 2026-09-02. The Cowork routine kept writing drafts and never
  # scheduling them (three missed posts: 08-19, 08-28, 09-02), because its
  # "schedule the orphan" step is an instruction to an LLM, not code. This
  # pipeline is deterministic: Gemini researches the topic, the draft is
  # written, and the approval request goes to Telegram with working tap-links.
  schedule:
    - cron: '17 8 * * 1,3,5'   # Mon, Wed, Fri at 08:17 UTC — drafts for the NEXT slot.
  workflow_dispatch:           # Allow manual trigger from GitHub UI
    inputs:
      topic:
        description: 'Optional custom blog topic'
        required: false
        type: string
      keyword:
        description: 'Optional primary keyword'
        required: false
        type: string
      category:
        description: 'Optional category'
        required: false
        default: 'AI Automation'
        type: string
      pain_point:
        description: 'Reader pain point to solve'
        required: false
        type: string
      angle:
        description: 'Specific angle or story direction'
        required: false
        type: string
      tone_notes:
        description: 'Tone notes, e.g. funny, relatable, pain relief, practical'
        required: false
        type: string
      source_notes:
        description: 'Source notes, creator update, or story direction to respond to without copying'
        required: false
        type: string
      source_url:
        description: 'Optional source URL for context'
        required: false
        type: string
      fiker_take:
        description: 'Fiker/LuliDigital point of view to add'
        required: false
        type: string
      publish_status:
        description: 'Publish immediately or save as hidden draft'
        required: false
        default: 'draft'
        type: choice
        options:
          - draft
          - publish
      cta_text:
        description: 'End-of-article CTA button text'
        required: false
        type: string
      cta_link:
        description: 'CTA link path, e.g. /ai or /marketing'
        required: false
        type: string
      use_seo_agent:
        description: 'Use daily SEO agent keyword when no topic is supplied'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: lulidigital-content-writes
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Production has to pause for approval or it just fills the repo. Drafts
      # were written every Mon/Wed/Fri while approval happens in a routine
      # session, so 18 piled up and nothing published for over a week. An
      # unapproved 19th draft is not output, it is noise.
      - name: Stop if drafts are already waiting
        id: backlog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Only count drafts from the last 45 days — ancient ones are a
          # separate cleanup decision, not a reason to stop writing forever.
          WAITING=$(node -e "
            const fs=require('fs');
            const cut=Date.now()-45*864e5;
            const n=fs.readdirSync('src/content/blog').filter(f=>{
              if(!f.endsWith('.md'))return false;
              const t=fs.readFileSync('src/content/blog/'+f,'utf8');
              const fm=(t.match(/^---\n([\s\S]*?)\n---/)||[])[1]||'';
              if(!/^draft:\s*true\s*\$/m.test(fm))return false;
              if(/^scheduledFor:/m.test(fm))return false;
              const d=(fm.match(/^pubDate:\s*(\S+)/m)||[])[1];
              return d && Date.parse(d)>=cut;
            }).length;
            console.log(n);
          ")
          echo "Unapproved recent drafts: $WAITING"
          if [ "$WAITING" -ge 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              TEXT=$(printf "\U0001F4E5 %s drafts are already waiting for your approval, so I didn't write another one today.\n\nApprove or drop some in the Claude routine session and writing resumes automatically." "$WAITING")
              node scripts/tg.mjs --text "${TEXT}"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep the topic memory current before writing, so the duplicate check
      # compares against what is actually published today.
      - name: Refresh topic memory
        if: steps.backlog.outputs.skip != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/topic-memory.mjs --sync

      - name: Generate blog post
        if: steps.backlog.outputs.skip != 'true'
        run: node scripts/generate-post.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_TOPIC: ${{ github.event.inputs.topic }}
          BLOG_KEYWORD: ${{ github.event.inputs.keyword }}
          BLOG_CATEGORY: ${{ github.event.inputs.category }}
          BLOG_PAIN_POINT: ${{ github.event.inputs.pain_point }}
          BLOG_ANGLE: ${{ github.event.inputs.angle }}
          BLOG_TONE_NOTES: ${{ github.event.inputs.tone_notes }}
          BLOG_SOURCE_NOTES: ${{ github.event.inputs.source_notes }}
          BLOG_SOURCE_URL: ${{ github.event.inputs.source_url }}
          BLOG_FIKER_TAKE: ${{ github.event.inputs.fiker_take }}
          BLOG_DRAFT: ${{ github.event_name == 'schedule' && 'true' || (github.event.inputs.publish_status != 'publish' && 'true' || 'false') }}
          BLOG_CTA_TEXT: ${{ github.event.inputs.cta_text }}
          BLOG_CTA_LINK: ${{ github.event.inputs.cta_link }}
          BLOG_USE_SEO_AGENT: ${{ github.event_name == 'schedule' || github.event.inputs.use_seo_agent == 'true' }}
          SEO_AGENT_GEO: ${{ vars.SEO_AGENT_GEO || 'NL' }}
          BLOG_SEO_AGENT_GEOS: ${{ vars.BLOG_SEO_AGENT_GEOS || 'NL,DE,SE,GB,US,DK,CH,IE,BE,NO,AFRICA' }}

      - name: Save review state (draft only)
        if: ${{ steps.backlog.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.publish_status != 'publish') }}
        run: node scripts/save-review-state.mjs

      - name: Commit and push new post
        if: steps.backlog.outputs.skip != 'true'
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/ scripts/blog-topics.json scripts/lana-memory.json
          git diff --staged --quiet && echo "No changes" && exit 0
          if [ "${{ github.event_name == 'schedule' || github.event.inputs.publish_status != 'publish' }}" = "true" ]; then
            git commit -m "Auto: draft $(cat /tmp/post_title.txt)"
          else
            git commit -m "Auto: publish $(cat /tmp/post_title.txt)"
          fi
          git push

      - name: Publish Google Business Profile post
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_status == 'publish' }}
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          DESCRIPTION=$(cat /tmp/post_description.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          node scripts/publish-google-business-post.mjs "$TITLE" "$DESCRIPTION" "$SLUG"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ACCOUNT_ID: ${{ secrets.GOOGLE_ACCOUNT_ID }}
          GOOGLE_LOCATION_ID: ${{ secrets.GOOGLE_LOCATION_ID }}

      - name: Send Telegram notification
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_status == 'publish' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set in GitHub secrets."
            exit 1
          fi
          TITLE=$(cat /tmp/post_title.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          URL="https://lulidigital.com/blog/${SLUG}"
          TEXT=$(printf "New post live on LuliDigital\n\n%s\n\n%s\n\nNot happy? Reply: take down %s" "$TITLE" "$URL" "$SLUG")
          node scripts/tg.mjs --text "${TEXT}"

      - name: Send draft preview for approval
        if: ${{ steps.backlog.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.publish_status != 'publish') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOG_PREVIEW_TOKEN: ${{ secrets.BLOG_PREVIEW_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: Telegram secrets not set."
            exit 1
          fi
          # Webhook re-registration removed 2026-07-14: the Telegram bot now
          # belongs to OpenClaw (long-polling); re-registering would break it.
          TITLE=$(cat /tmp/post_title.txt)
          DESCRIPTION=$(cat /tmp/post_description.txt)
          PREVIEW=$(cat /tmp/review_preview.txt)
          SCHEDULED_FOR=$(cat /tmp/review_scheduled_for.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          # The /draft/ preview and /api/approve-blog both gate on
          # BLOG_PREVIEW_TOKEN, and that env var does not match on Vercel — both
          # return a 9-byte "Not found". Every Approve tap since has silently
          # done nothing, which is why 6 drafts piled up unpublished and the
          # links looked empty. The repo is public, so the raw markdown on
          # GitHub needs no token and cannot break the same way.
          READ_URL="https://github.com/Fiker-dev/lulidigital/blob/main/src/content/blog/${SLUG}.md"

          # QA the link BEFORE sending it. Fiker spent two weeks tapping links
          # that returned "Not found" because nothing ever checked them. A
          # broken link in an approval message is worse than no message: it
          # looks like the system worked.
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$READ_URL")
            [ "$CODE" = "200" ] && break
            echo "Read link not ready (HTTP $CODE) — retry $i/6"; sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "ERROR: read link is $CODE, not 200 — refusing to send a broken approval message."
            node scripts/tg.mjs --text "⚠️ Draft '${SLUG}' was written, but its read link returns HTTP ${CODE}. Not sending a broken link. Ask Claude to check auto-blog.yml."
            exit 1
          fi
          echo "Read link verified HTTP 200."
          TEXT=$(printf "\U0001F4DD Draft ready for your approval\n\n%s\n\n%s\n\n%s\n\nRead it:\n%s\n\nWould go live: %s\nSlug: %s\n\nTo approve: reply in the Claude routine session — say \"approve\" to schedule it, or tell it what to change. Nothing publishes until you do.\n\nYou'll get a separate \"blog is live\" message here once it actually publishes." "$TITLE" "$DESCRIPTION" "$PREVIEW" "$READ_URL" "$SCHEDULED_FOR" "$SLUG")
          node scripts/tg.mjs --text "${TEXT}" --no-preview
