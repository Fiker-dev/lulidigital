name: Auto Blog Post

on:
  schedule:
    - cron: '0 8 * * 1,3,5'  # Mon, Wed, Fri at 8am UTC
  workflow_dispatch:           # Allow manual trigger from GitHub UI
    inputs:
      topic:
        description: 'Optional custom blog topic'
        required: false
        type: string
      keyword:
        description: 'Optional primary keyword'
        required: false
        type: string
      category:
        description: 'Optional category'
        required: false
        default: 'AI Automation'
        type: string
      pain_point:
        description: 'Reader pain point to solve'
        required: false
        type: string
      angle:
        description: 'Specific angle or story direction'
        required: false
        type: string
      tone_notes:
        description: 'Tone notes, e.g. funny, relatable, pain relief, practical'
        required: false
        type: string
      publish_status:
        description: 'Publish immediately or save as hidden draft'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - draft

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog post
        run: node scripts/generate-post.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_TOPIC: ${{ github.event.inputs.topic }}
          BLOG_KEYWORD: ${{ github.event.inputs.keyword }}
          BLOG_CATEGORY: ${{ github.event.inputs.category }}
          BLOG_PAIN_POINT: ${{ github.event.inputs.pain_point }}
          BLOG_ANGLE: ${{ github.event.inputs.angle }}
          BLOG_TONE_NOTES: ${{ github.event.inputs.tone_notes }}
          BLOG_DRAFT: ${{ github.event.inputs.publish_status == 'draft' }}

      - name: Commit and push new post
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/ scripts/blog-topics.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto: publish $(cat /tmp/post_title.txt)"
          git push

      - name: Publish Google Business Profile post
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_status != 'draft' }}
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          DESCRIPTION=$(cat /tmp/post_description.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          node scripts/publish-google-business-post.mjs "$TITLE" "$DESCRIPTION" "$SLUG"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ACCOUNT_ID: ${{ secrets.GOOGLE_ACCOUNT_ID }}
          GOOGLE_LOCATION_ID: ${{ secrets.GOOGLE_LOCATION_ID }}

      - name: Send Telegram notification
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_status != 'draft' }}
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          CATEGORY=$(cat /tmp/post_category.txt)
          URL="https://lulidigital.com/blog/${SLUG}"
          MESSAGE=$(cat <<EOF
          New post live on LuliDigital

          ${CATEGORY}
          ${TITLE}

          ${URL}

          Not happy with it? Reply "take down ${SLUG}" and I'll remove it.
          EOF
          )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Send Telegram draft preview
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_status == 'draft' }}
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          CATEGORY=$(cat /tmp/post_category.txt)
          DESCRIPTION=$(cat /tmp/post_description.txt)
          MESSAGE=$(cat <<EOF
          Draft ready for review

          ${CATEGORY}
          ${TITLE}

          ${DESCRIPTION}

          Approve now:
          /publish ${SLUG}

          Schedule:
          /schedule ${SLUG} YYYY-MM-DD
          EOF
          )
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}"
