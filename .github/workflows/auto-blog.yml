name: Auto Blog Post

on:
  schedule:
    - cron: '0 8 * * 1,3,5'  # Mon, Wed, Fri at 8am UTC
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog post
        run: node scripts/generate-post.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push new post
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/ scripts/blog-topics.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto: publish $(cat /tmp/post_title.txt)"
          git push

      - name: Send Telegram notification
        run: |
          TITLE=$(cat /tmp/post_title.txt)
          SLUG=$(cat /tmp/post_slug.txt)
          CATEGORY=$(cat /tmp/post_category.txt)
          URL="https://lulidigital.com/blog/${SLUG}"
          MESSAGE="New article published on LuliDigital%0A%0A${CATEGORY}%0A${TITLE}%0A%0A${URL}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MESSAGE}&parse_mode=HTML"
