name: Index On Publish

# When a push to main flips a blog post from draft to live (e.g. "publish it
# now" approved in the Cowork routine session), request Google indexing for
# that post. publish-scheduled.yml indexes its own publishes and is skipped
# by the script.

on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Detect which posts flipped live
        run: node scripts/index-published-changes.mjs --detect-only

      - name: Verify the posts are actually LIVE
        run: |
          # A push landing does not mean the page exists — Vercel still has to
          # build it. Poll before announcing anything, so we never send a dead
          # link (which happened on 2026-08-21).
          if [ ! -s /tmp/newly-live.json ] || [ "$(cat /tmp/newly-live.json)" = "[]" ]; then
            echo "nothing flipped live; nothing to verify"; exit 0
          fi
          ALL_LIVE=true
          for url in $(node -e "JSON.parse(require('fs').readFileSync('/tmp/newly-live.json','utf8')).forEach(p=>console.log(p.url))"); do
            CODE=000
            for i in $(seq 1 24); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
              [ "$CODE" = "200" ] && break
              sleep 10
            done
            echo "$CODE  $url"
            [ "$CODE" = "200" ] || ALL_LIVE=false
          done
          echo "$ALL_LIVE" > /tmp/all_live.txt

      - name: Request indexing for newly live posts
        run: |
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo true)" != "true" ]; then
            echo "Not reachable yet — skipping indexing so we don't submit 404s."
            exit 0
          fi
          node scripts/index-published-changes.mjs
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}

      - name: Telegram notification (blog live + GBP caption)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f /tmp/newly-live.json ]; then exit 0; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          if [ "$(cat /tmp/all_live.txt 2>/dev/null || echo true)" = "true" ]; then
            MSG=$(node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/newly-live.json','utf8'));console.log('✅ Blog live + submitted to Google:\n\n'+p.map(x=>x.title+'\n'+x.url).join('\n\n')+'\n\n📍 Google Business Profile — paste as a new post, button Learn more → the link above:\n———\n'+p.map(x=>'New from LuliDigital: '+x.title+'.').join('\n')+'\n———')")
          else
            MSG=$(node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/newly-live.json','utf8'));console.log('⚠️ Blog published in git but NOT reachable yet — the Vercel deploy has probably failed. NOT submitted to Google.\n\n'+p.map(x=>x.title+'\n'+x.url).join('\n\n')+'\n\nCheck: vercel ls (UNKNOWN status with no build duration = it never built).')")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
