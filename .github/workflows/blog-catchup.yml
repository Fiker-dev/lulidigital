name: Blog Catch-up

# Safety net for the Auto Blog Post schedule. GitHub silently drops scheduled
# runs sometimes (and a run can fail). A few hours after each blog slot this
# checks whether a post was actually created today; if not, it triggers a
# DRAFT (never auto-publishes) so the post still lands in Telegram for approval.

on:
  # RESTORED 2026-09-07 with the auto-blog cron it backstops. On 2026-09-04 the
  # 08:17 run failed (dead Gemini key -> fallback picked an already-published
  # slug -> overwrite guard aborted) and nothing retried, so the day was simply
  # lost. 15:17 is late enough to clear a delayed main run: GitHub routinely
  # fires the 08:17 cron 3-4h late (12:41 on 09-04).
  schedule:
    - cron: '17 15 * * 1,3,5'
  workflow_dispatch:

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if a post was created today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%F)

          # Don't race a delayed main run. The 08:17 cron often fires hours
          # late, so "no file yet" can just mean "still writing" — triggering
          # then would produce two drafts for the same day.
          STATE=$(gh run list --workflow=auto-blog.yml --limit 5 \
                    --json createdAt,status \
                    --jq "[.[] | select(.createdAt | startswith(\"$TODAY\")) | .status] | join(\",\")" \
                  -R "${{ github.repository }}" 2>/dev/null || echo "")
          echo "auto-blog runs today: ${STATE:-none}"
          case "$STATE" in
            *in_progress*|*queued*|*requested*|*waiting*)
              echo "missed=false" >> "$GITHUB_OUTPUT"
              echo "The main run is still going — leaving it alone."
              exit 0 ;;
          esac

          # A blog .md added today means the draft landed, whoever wrote it.
          if git log --since="00:00" --diff-filter=A --name-only --pretty=format: | grep -q '^src/content/blog/.*\.md$'; then
            echo "missed=false" >> "$GITHUB_OUTPUT"
            echo "A blog post was already created today — nothing to catch up."
          else
            echo "missed=true" >> "$GITHUB_OUTPUT"
            echo "No blog post today — the scheduled run was dropped or failed. Triggering a draft."
          fi

      - name: Trigger a draft if the scheduled run was missed
        if: steps.check.outputs.missed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Auto Blog Post" -f publish_status=draft -R "${{ github.repository }}"

      - name: Notify Telegram if caught up
        if: steps.check.outputs.missed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Heads up: today's scheduled blog run didn't happen, so I triggered a catch-up draft. It'll arrive shortly for your approval." > /dev/null
