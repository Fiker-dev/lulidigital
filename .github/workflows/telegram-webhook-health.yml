name: Telegram Webhook Health

on:
  # RETIRED 2026-07-14: blog approval moved into the Cowork routine session,
  # so the Telegram webhook is no longer needed — and this workflow was
  # fighting OpenClaw (which long-polls the same bot) every 6 hours. The
  # Telegram bot now belongs to OpenClaw. See routines/README.md.
  # schedule:
  #   - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ensure-telegram-webhook:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Ensure Telegram approval webhook
        run: node scripts/ensure-telegram-webhook.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
