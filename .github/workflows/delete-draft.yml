name: Delete Draft Post

# Permanently removes a draft from the repo. LANa triggers this when you say
# "delete the draft" or "/delete-draft {slug}" in Telegram.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft blog slug to delete'
        required: true
        type: string

concurrency:
  group: lulidigital-content-writes
  cancel-in-progress: false

jobs:
  delete-draft:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DELETE_SLUG: ${{ github.event.inputs.slug }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Delete draft file
        run: |
          set +e
          node scripts/delete-draft-post.mjs "$DELETE_SLUG"
          STATUS=$?
          set -e
          if [ "$STATUS" != "0" ]; then
            if [ "$STATUS" != "2" ]; then exit "$STATUS"; fi
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=Could not find a draft with slug: ${DELETE_SLUG}. Check the slug and try again."
            exit 0
          fi

      - name: Clear review state and pending_drafts from memory
        run: |
          node scripts/clear-review-state.mjs "$DELETE_SLUG"
          node -e "
            const fs=require('fs');
            const p='scripts/lana-memory.json';
            if(!fs.existsSync(p)) process.exit(0);
            const m=JSON.parse(fs.readFileSync(p,'utf8'));
            m.pending_drafts=(m.pending_drafts||[]).filter(s=>s!==process.env.DELETE_SLUG);
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          "

      - name: Commit and push
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/ scripts/lana-memory.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Delete draft blog post ${DELETE_SLUG}"
          git push

      - name: Send Telegram confirmation
        run: |
          SLUG="$DELETE_SLUG"
          TEXT=$(printf "Draft deleted: %s\n\nIt's gone from the repo. Want me to write a new one? Just tell me the topic." "$SLUG")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${TEXT}"
