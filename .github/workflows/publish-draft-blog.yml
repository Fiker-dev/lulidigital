name: Publish Draft Blog Post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft blog slug to publish'
        required: true
        type: string
      publish_date:
        description: 'Publish date, YYYY-MM-DD. Use today for immediate publishing.'
        required: false
        type: string

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish draft
        run: node scripts/publish-draft-post.mjs "${{ github.event.inputs.slug }}" "${{ github.event.inputs.publish_date }}"

      - name: Clear review state from memory
        run: node scripts/clear-review-state.mjs "${{ github.event.inputs.slug }}"

      - name: Commit and push published draft
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/ scripts/lana-memory.json
          if git diff --staged --quiet; then
            echo "false" > /tmp/published_changed.txt
            echo "No draft changes"
            exit 0
          fi
          git commit -m "Publish draft blog post ${{ github.event.inputs.slug }}"
          git push
          echo "true" > /tmp/published_changed.txt

      - name: Request indexing for the published post
        run: |
          if [ "$(cat /tmp/published_changed.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Draft was already published. Skipping indexing request."
            exit 0
          fi
          node scripts/request-indexing.mjs "https://lulidigital.com/blog/${{ github.event.inputs.slug }}"
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}

      - name: Publish Google Business Profile post
        run: |
          if [ "$(cat /tmp/published_changed.txt 2>/dev/null || echo false)" != "true" ]; then
            echo "Draft was already published. Skipping Google Business Profile repost."
            exit 0
          fi
          SLUG="${{ github.event.inputs.slug }}"
          node -e "const fs=require('fs');const raw=fs.readFileSync('src/content/blog/'+process.argv[1]+'.md','utf8');const get=(k)=>raw.match(new RegExp('^'+k+':\\\\s*\"?([^\"\\\\n]+)\"?','m'))?.[1]||'';fs.writeFileSync('/tmp/published_title.txt',get('title'));fs.writeFileSync('/tmp/published_description.txt',get('description'));" "$SLUG"
          TITLE=$(cat /tmp/published_title.txt)
          DESCRIPTION=$(cat /tmp/published_description.txt)
          node scripts/publish-google-business-post.mjs "$TITLE" "$DESCRIPTION" "$SLUG"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ACCOUNT_ID: ${{ secrets.GOOGLE_ACCOUNT_ID }}
          GOOGLE_LOCATION_ID: ${{ secrets.GOOGLE_LOCATION_ID }}

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set in GitHub secrets."
            exit 1
          fi
          SLUG="${{ github.event.inputs.slug }}"
          DATE="${{ github.event.inputs.publish_date }}"
          URL="https://lulidigital.com/blog/${SLUG}"
          # Pull title + description for a ready-to-paste Google Business Profile update.
          node -e "const fs=require('fs');const raw=fs.readFileSync('src/content/blog/'+process.argv[1]+'.md','utf8');const get=(k)=>raw.match(new RegExp('^'+k+':\\\\s*\"?([^\"\\\\n]+)\"?','m'))?.[1]||'';fs.writeFileSync('/tmp/gt.txt',get('title'));fs.writeFileSync('/tmp/gd.txt',get('description'));" "$SLUG" || true
          TITLE=$(cat /tmp/gt.txt 2>/dev/null)
          DESCRIPTION=$(cat /tmp/gd.txt 2>/dev/null)
          if [ -z "$DATE" ]; then
            TEXT=$(printf "✅ Approved & published\n%s\n\n📍 Post on Google Business Profile — paste this caption, set the button to \"Learn more\" → the link:\n———\nNew from LuliDigital: %s. %s\n———\nLink: %s" "$URL" "$TITLE" "$DESCRIPTION" "$URL")
          else
            TEXT=$(printf "🗓 Scheduled for %s\n%s\n\n(Post to Google Business Profile once it goes live that day.)" "$DATE" "$URL")
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Telegram response: $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then echo "ERROR: Telegram failed HTTP $HTTP_CODE"; exit 1; fi
