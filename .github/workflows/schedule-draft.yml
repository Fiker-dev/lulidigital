name: Schedule Draft Blog Post

# Triggered by lana-telegram.ts when Fiker approves a draft. The post is queued
# for its date (stays hidden) and goes live via Publish Scheduled Posts.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft blog slug to schedule'
        required: true
        type: string
      date:
        description: 'Go-live date, YYYY-MM-DD'
        required: true
        type: string

concurrency:
  group: lulidigital-content-writes
  cancel-in-progress: false

jobs:
  schedule-draft:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCHEDULE_SLUG: ${{ github.event.inputs.slug }}
      SCHEDULE_DATE: ${{ github.event.inputs.date }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Mark draft as scheduled
        run: node scripts/schedule-draft-post.mjs "$SCHEDULE_SLUG" "$SCHEDULE_DATE"

      - name: Clear review state from memory
        run: node scripts/clear-review-state.mjs "$SCHEDULE_SLUG"

      # Built HERE, at approval, not "when the Social Team routine next runs".
      # A post used to go live with no pack, so Telegram said "announcement
      # isn't written yet" instead of sending the announcement.
      - name: Build the LinkedIn company announcement pack
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/generate-blog-announcement.mjs --slug "$SCHEDULE_SLUG"

      - name: Commit and push
        run: |
          git config user.name "LuliDigital Bot"
          git config user.email "bot@lulidigital.com"
          git add src/content/blog/ scripts/lana-memory.json social/queue/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Schedule draft ${SCHEDULE_SLUG} for ${SCHEDULE_DATE}"
          git push

      - name: Telegram confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          TEXT=$(printf "🗓 Scheduled: %s\n\nGoes live %s (around 04:30 UTC) and gets submitted to Google automatically.\n\nThe LinkedIn company announcement is written and waiting — caption + asset land here the moment the post is confirmed live." "$SCHEDULE_SLUG" "$SCHEDULE_DATE")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null
